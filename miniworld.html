<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件/压缩包加解密</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, sans-serif; background: #f0f2f5; padding: 16px; }
    .container { max-width: 500px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .title { text-align: center; font-size: 20px; font-weight: 700; }
    .mode-row { display: flex; gap: 10px; margin: 12px 0; }
    .mode-btn { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: #fff; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; }
    .mode-btn.active-e { border-color: #2563eb; background: #dbeafe; color: #2563eb; }
    .mode-btn.active-d { border-color: #16a34a; background: #dcfce7; color: #16a34a; }
    .input-type-row { display: flex; gap: 10px; margin: 12px 0; }
    .input-type-btn { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px; background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
    .input-type-btn.active-file { border-color: #2563eb; background: #dbeafe; color: #2563eb; }
    .input-type-btn.active-zip { border-color: #7c3aed; background: #ede9fe; color: #7c3aed; }
    .upload-area { border: 2px dashed #ccc; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 12px; background: #fafafa; }
    .upload-area.dragover { border-color: #2563eb; background: #eff6ff; }
    .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-zip { background: #7c3aed; color: #fff; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; transform: none; }
    .file-item { padding: 6px 10px; background: #f5f5f5; border-radius: 4px; margin-bottom: 3px; font-size: 13px; display: flex; justify-content: space-between; }
    .file-list { max-height: 200px; overflow-y: auto; margin: 10px 0; }
    .progress-bar { height: 6px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin: 10px 0; }
    .progress-fill { height: 100%; background: #2563eb; width: 0%; transition: width 0.3s; }
    .result-item { padding: 10px; border-radius: 6px; margin-bottom: 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .result-ok { background: #dcfce7; }
    .result-err { background: #fee2e2; }
    .dbtn { padding: 4px 12px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; }
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .text-sm { font-size: 13px; color: #666; }
    .mt-8 { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .badge { padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .badge-e { background: #dbeafe; color: #2563eb; }
    .badge-d { background: #dcfce7; color: #16a34a; }
    .badge-file { background: #dbeafe; color: #2563eb; }
    .badge-zip { background: #ede9fe; color: #7c3aed; }
    .footer { text-align: center; font-size: 12px; color: #999; padding: 16px 0; }
    .ext-badge { display: inline-block; padding: 0 8px; border-radius: 3px; font-size: 11px; background: #e5e7eb; color: #555; margin-left: 4px; }
    .file-count { font-size: 14px; color: #666; margin: 8px 0; }
    .single-download-btn { padding: 4px 12px; background: #2563eb; color: #fff; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>
<div class="container">
  <div class="card" style="background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;">
    <div class="title">🔐 文件加解密</div>
    <div class="text-center text-sm" style="opacity:0.7;">支持单个文件 或 压缩包批量处理</div>
  </div>

  <div class="card">
    <!-- 加解密模式 -->
    <div class="mode-row">
      <button id="mE" class="mode-btn active-e">🔒 加密</button>
      <button id="mD" class="mode-btn">🔓 解密</button>
    </div>
    <div id="hint" class="text-center text-sm" style="margin-bottom:10px;">当前：<span class="badge badge-e">加密</span></div>

    <!-- 输入类型切换 -->
    <div class="input-type-row">
      <button id="typeFile" class="input-type-btn active-file">📄 单个文件</button>
      <button id="typeZip" class="input-type-btn">📦 压缩包</button>
    </div>
    <div id="typeHint" class="text-center text-sm" style="margin-bottom:10px;color:#888;">模式：<span class="badge badge-file">单个文件</span></div>

    <!-- 上传区域 -->
    <div class="upload-area" id="dropArea">
      <div style="font-size:48px;" id="dropIcon">📄</div>
      <div style="color:#888;font-size:14px;" id="dropText">拖拽文件到这里，或点击下方按钮</div>
      <div style="color:#aaa;font-size:12px;margin-top:4px;" id="dropHint">支持所有格式</div>
    </div>

    <!-- 隐藏 input -->
    <input type="file" id="fileInput" multiple style="display:none">
    <input type="file" id="zipInput" accept=".zip" style="display:none">

    <!-- 按钮 -->
    <button id="btnSelect" class="btn btn-primary">📂 选择文件</button>

    <!-- 文件列表 -->
    <div id="fileList" class="hidden">
      <div class="file-count" id="fileCount"></div>
      <div id="fileItems" class="file-list"></div>
    </div>

    <button id="btnProcess" class="btn btn-success mt-8" disabled>🚀 开始处理</button>

    <div id="progressArea" class="hidden mt-8">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressText" class="text-center text-sm">0%</div>
    </div>
  </div>

  <div id="resultCard" class="card hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
      <strong>📋 处理结果</strong>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button id="btnDownloadZip" class="dbtn" style="background:#16a34a;padding:6px 14px;display:none;">⬇️ 下载 ZIP</button>
        <button id="btnDownloadAll" class="dbtn" style="background:#2563eb;padding:6px 14px;display:none;">⬇️ 逐个下载</button>
      </div>
    </div>
    <div id="resultList"></div>
  </div>

  <div class="footer">是史三问呀 · QQ:2196634956</div>
</div>

<script>
// ===== 动态加载 JSZip =====
async function loadJSZip() {
  try {
    const module = await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
    return module.default || module.JSZip;
  } catch (e) {
    try {
      const module = await import('https://unpkg.com/jszip@3.10.1/dist/jszip.min.js');
      return module.default || module.JSZip;
    } catch (e2) {
      throw new Error('JSZip 加载失败，请检查网络连接');
    }
  }
}

// ===== 核心加解密 =====
const KEY = new Uint8Array([214,2,8,0,244,254,255,63,1,0,0,0,208,202,1,0]);

async function xorData(data) {
  const input = new Uint8Array(data);
  const out = new Uint8Array(input.length);
  for (let i = 0; i < input.length; i++) out[i] = input[i] ^ KEY[i % KEY.length];
  return out.buffer;
}

async function processFileData(data, mode) {
  let result;
  if (mode === 'decrypt') {
    const x = await xorData(data.slice(8));
    result = await new Response(new Blob([x]).stream().pipeThrough(new DecompressionStream('deflate'))).arrayBuffer();
  } else {
    const c = await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer();
    const x = await xorData(c);
    const out = new Uint8Array(8 + x.byteLength);
    out.set(new Uint8Array(8));
    out.set(new Uint8Array(x), 8);
    result = out.buffer;
  }
  return result;
}

// ===== UI =====
let mode = 'encrypt';
let inputType = 'file'; // 'file' 或 'zip'
let selectedFiles = [];
let zipFile = null;
let zipEntries = [];
let processedResults = [];
let processing = false;
let JSZipLib = null;

const $ = id => document.getElementById(id);
const mE = $('mE'), mD = $('mD'), hint = $('hint');
const typeFile = $('typeFile'), typeZip = $('typeZip'), typeHint = $('typeHint');
const fileInput = $('fileInput'), zipInput = $('zipInput');
const btnSelect = $('btnSelect');
const dropArea = $('dropArea'), dropIcon = $('dropIcon'), dropText = $('dropText'), dropHint = $('dropHint');
const fileList = $('fileList'), fileItems = $('fileItems'), fileCount = $('fileCount');
const btnProcess = $('btnProcess');
const progressArea = $('progressArea'), progressFill = $('progressFill'), progressText = $('progressText');
const resultCard = $('resultCard'), resultList = $('resultList');
const btnDownloadZip = $('btnDownloadZip'), btnDownloadAll = $('btnDownloadAll');

// ===== 模式切换 =====
function setMode(m) {
  mode = m;
  mE.className = `mode-btn${m==='encrypt'?' active-e':''}`;
  mD.className = `mode-btn${m==='decrypt'?' active-d':''}`;
  const label = m==='encrypt'?'加密':'解密';
  const cls = m==='encrypt'?'badge-e':'badge-d';
  hint.innerHTML = `当前：<span class="badge ${cls}">${label}</span>`;
  resetAll();
}
mE.onclick = ()=>setMode('encrypt');
mD.onclick = ()=>setMode('decrypt');

// ===== 输入类型切换 =====
function setInputType(type) {
  inputType = type;
  typeFile.className = `input-type-btn${type==='file'?' active-file':''}`;
  typeZip.className = `input-type-btn${type==='zip'?' active-zip':''}`;
  const label = type==='file'?'单个文件':'压缩包';
  const cls = type==='file'?'badge-file':'badge-zip';
  typeHint.innerHTML = `模式：<span class="badge ${cls}">${label}</span>`;
  
  if (type === 'file') {
    dropIcon.textContent = '📄';
    dropText.textContent = '拖拽文件到这里，或点击下方按钮';
    dropHint.textContent = '支持所有格式，可多选';
    btnSelect.textContent = '📂 选择文件（可多选）';
    btnSelect.className = 'btn btn-primary';
  } else {
    dropIcon.textContent = '📦';
    dropText.textContent = '拖拽 ZIP 到这里，或点击下方按钮';
    dropHint.textContent = '支持 .zip 格式';
    btnSelect.textContent = '📁 选择压缩包 (.zip)';
    btnSelect.className = 'btn btn-zip';
  }
  resetAll();
}
typeFile.onclick = ()=>setInputType('file');
typeZip.onclick = ()=>setInputType('zip');

// ===== 选择按钮 =====
btnSelect.onclick = ()=>{
  if (inputType === 'file') fileInput.click();
  else zipInput.click();
};

// ===== 拖拽 =====
dropArea.ondragover = (e) => { e.preventDefault(); dropArea.classList.add('dragover'); };
dropArea.ondragleave = () => dropArea.classList.remove('dragover');
dropArea.ondrop = (e) => {
  e.preventDefault();
  dropArea.classList.remove('dragover');
  const files = e.dataTransfer.files;
  if (!files.length) return;
  
  if (inputType === 'file') {
    handleFiles(files);
  } else {
    if (files[0].name.endsWith('.zip') || files[0].type === 'application/zip') {
      loadZip(files[0]);
    } else {
      alert('请拖拽 .zip 文件');
    }
  }
};

// ===== 文件选择 =====
fileInput.onchange = (e) => {
  if (e.target.files.length) handleFiles(e.target.files);
  e.target.value = '';
};

zipInput.onchange = (e) => {
  if (e.target.files.length) loadZip(e.target.files[0]);
  e.target.value = '';
};

// ===== 处理选中的文件（单个文件模式） =====
function handleFiles(fileList) {
  const valid = [];
  for (const f of fileList) {
    if (f.size > 100 * 1024 * 1024) { alert(`"${f.name}" 超过100MB`); continue; }
    valid.push(f);
  }
  if (!valid.length) return;
  selectedFiles = selectedFiles.concat(valid);
  renderFileList();
  btnProcess.disabled = false;
}

function renderFileList() {
  if (!selectedFiles.length) { fileList.classList.add('hidden'); return; }
  fileList.classList.remove('hidden');
  let html = '';
  let total = 0;
  const maxShow = 100;
  const show = selectedFiles.slice(0, maxShow);
  for (const f of show) {
    total += f.size;
    const ext = f.name.split('.').pop().toLowerCase();
    html += `<div class="file-item"><span>${f.name} <span class="ext-badge">${ext}</span></span><span>${(f.size/1024).toFixed(1)}KB</span></div>`;
  }
  if (selectedFiles.length > maxShow) {
    html += `<div class="file-item" style="background:transparent;color:#999;">... 还有 ${selectedFiles.length - maxShow} 个文件</div>`;
  }
  fileItems.innerHTML = html;
  fileCount.textContent = `📄 共 ${selectedFiles.length} 个文件 ｜ 总大小 ${(total/1024/1024).toFixed(2)}MB`;
}

// ===== 加载压缩包 =====
async function loadZip(file) {
  resetAll();
  zipFile = file;
  try {
    if (!JSZipLib) JSZipLib = await loadJSZip();
    const data = await file.arrayBuffer();
    const zip = await JSZipLib.loadAsync(data);
    
    zipEntries = [];
    zip.forEach((path, entry) => {
      if (!entry.dir) {
        zipEntries.push({ path, entry });
      }
    });
    
    if (zipEntries.length === 0) {
      alert('压缩包为空或没有文件');
      return;
    }
    
    fileList.classList.remove('hidden');
    let html = '';
    let totalSize = 0;
    const maxShow = 100;
    const show = zipEntries.slice(0, maxShow);
    for (const { path, entry } of show) {
      const size = entry._data ? entry._data.uncompressedSize || 0 : 0;
      totalSize += size;
      const ext = path.split('.').pop().toLowerCase();
      html += `<div class="file-item"><span>${path} <span class="ext-badge">${ext}</span></span><span>${(size/1024).toFixed(1)}KB</span></div>`;
    }
    if (zipEntries.length > maxShow) {
      html += `<div class="file-item" style="background:transparent;color:#999;">... 还有 ${zipEntries.length - maxShow} 个文件</div>`;
    }
    fileItems.innerHTML = html;
    fileCount.textContent = `📄 共 ${zipEntries.length} 个文件 ｜ 总大小 ${(totalSize/1024/1024).toFixed(2)}MB`;
    btnProcess.disabled = false;
  } catch (e) {
    alert('读取压缩包失败: ' + e.message);
    console.error(e);
  }
}

// ===== 重置 =====
function resetAll() {
  selectedFiles = [];
  zipFile = null;
  zipEntries = [];
  processedResults = [];
  fileList.classList.add('hidden');
  resultCard.classList.add('hidden');
  progressArea.classList.add('hidden');
  btnProcess.disabled = true;
  progressFill.style.width = '0%';
  btnDownloadZip.style.display = 'none';
  btnDownloadAll.style.display = 'none';
}

// ===== 处理 =====
btnProcess.onclick = async () => {
  if (processing) return;
  
  if (inputType === 'file') {
    if (!selectedFiles.length) return;
    await processFiles();
  } else {
    if (!zipEntries.length || !zipFile) return;
    if (zipEntries.length > 500) {
      if (!confirm(`压缩包内有 ${zipEntries.length} 个文件，处理可能需要较长时间，继续吗？`)) return;
    }
    await processZip();
  }
};

// ===== 处理单个文件列表 =====
async function processFiles() {
  processing = true;
  btnProcess.disabled = true;
  btnProcess.textContent = '⏳ 处理中...';
  progressArea.classList.remove('hidden');
  resultCard.classList.add('hidden');
  processedResults = [];

  const total = selectedFiles.length;
  for (let i = 0; i < total; i++) {
    const f = selectedFiles[i];
    const pct = ((i + 1) / total * 100);
    progressFill.style.width = pct + '%';
    progressText.textContent = `处理中 ${pct.toFixed(0)}% (${i + 1}/${total}) - ${f.name}`;
    
    try {
      const data = await f.arrayBuffer();
      const processed = await processFileData(data, mode);
      const resultFile = new File([processed], f.name, { type: f.type });
      processedResults.push({ name: f.name, file: resultFile, status: 'ok', error: null });
    } catch (e) {
      processedResults.push({ name: f.name, file: null, status: 'err', error: e.message });
    }
  }

  renderFileResults();
  progressFill.style.width = '100%';
  progressText.textContent = '✅ 完成！';
  processing = false;
  btnProcess.disabled = false;
  btnProcess.textContent = '🚀 开始处理';
}

// ===== 处理压缩包 =====
async function processZip() {
  processing = true;
  btnProcess.disabled = true;
  btnProcess.textContent = '⏳ 处理中...';
  progressArea.classList.remove('hidden');
  resultCard.classList.add('hidden');
  processedResults = [];

  try {
    if (!JSZipLib) JSZipLib = await loadJSZip();
    const data = await zipFile.arrayBuffer();
    const zip = await JSZipLib.loadAsync(data);
    
    const total = zipEntries.length;
    const results = [];
    
    for (let i = 0; i < total; i++) {
      const { path, entry } = zipEntries[i];
      const pct = ((i + 1) / total * 100);
      progressFill.style.width = pct + '%';
      progressText.textContent = `处理中 ${pct.toFixed(0)}% (${i + 1}/${total}) - ${path}`;
      
      try {
        const fileData = await entry.async('arraybuffer');
        const processed = await processFileData(fileData, mode);
        results.push({ path, processed, status: 'ok', error: null });
      } catch (e) {
        results.push({ path, processed: null, status: 'err', error: e.message });
      }
    }
    
    progressText.textContent = '📦 重新打包中...';
    const newZip = new JSZipLib();
    let okCount = 0;
    for (const r of results) {
      if (r.status === 'ok' && r.processed) {
        newZip.file(r.path, r.processed);
        okCount++;
      } else {
        try {
          const orig = await zip.file(r.path).async('arraybuffer');
          newZip.file(r.path, orig);
        } catch (e) {}
      }
    }
    
    const blob = await newZip.generateAsync({ type: 'blob' });
    processedResults = results;
    window._resultBlob = blob;
    window._resultName = zipFile.name.replace(/\.zip$/i, '_' + mode + 'd.zip');
    window._isZipResult = true;
    
    renderZipResults(okCount);
    progressFill.style.width = '100%';
    progressText.textContent = '✅ 完成！';
    
  } catch (e) {
    alert('处理失败: ' + e.message);
    console.error(e);
  }

  processing = false;
  btnProcess.disabled = false;
  btnProcess.textContent = '🚀 开始处理';
}

// ===== 显示文件结果 =====
function renderFileResults() {
  resultCard.classList.remove('hidden');
  let html = '';
  let okCount = 0;
  for (const r of processedResults) {
    if (r.status === 'ok') okCount++;
    const cls = r.status === 'ok' ? 'result-ok' : 'result-err';
    const err = r.error ? ` - ${r.error}` : '';
    const btn = r.status === 'ok' && r.file
      ? `<button class="single-download-btn" onclick="downloadSingleFile('${encodeURIComponent(r.name)}')">下载</button>`
      : '';
    html += `<div class="result-item ${cls}">
      <span style="word-break:break-all;flex:1;margin-right:8px;font-size:13px;">${r.name}${err}</span>
      <span style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <span style="font-size:12px;font-weight:600;">${r.status==='ok'?'✅':'❌'}</span>
        ${btn}
      </span>
    </div>`;
  }
  window._fileResults = processedResults;
  resultList.innerHTML = html;
  btnDownloadZip.style.display = 'none';
  btnDownloadAll.style.display = okCount > 1 ? 'inline-block' : 'none';
  if (okCount === 1) btnDownloadAll.style.display = 'inline-block';
}

// ===== 显示压缩包结果 =====
function renderZipResults(okCount) {
  resultCard.classList.remove('hidden');
  let html = '';
  const maxShow = 50;
  const show = processedResults.slice(0, maxShow);
  for (const r of show) {
    const cls = r.status === 'ok' ? 'result-ok' : 'result-err';
    const err = r.error ? ` - ${r.error}` : '';
    html += `<div class="result-item ${cls}">
      <span style="word-break:break-all;flex:1;margin-right:8px;font-size:13px;">${r.path}${err}</span>
      <span style="font-size:12px;font-weight:600;flex-shrink:0;">${r.status==='ok'?'✅':'❌'}</span>
    </div>`;
  }
  if (processedResults.length > maxShow) {
    html += `<div style="text-align:center;color:#999;font-size:13px;padding:8px;">... 还有 ${processedResults.length - maxShow} 个文件</div>`;
  }
  resultList.innerHTML = html;
  btnDownloadZip.style.display = 'inline-block';
  btnDownloadZip.textContent = `⬇️ 下载 ZIP (${okCount}/${processedResults.length} 个成功)`;
  btnDownloadAll.style.display = 'none';
}

// ===== 下载单个文件 =====
window.downloadSingleFile = function(name) {
  const r = window._fileResults.find(x => x.name === decodeURIComponent(name));
  if (!r || !r.file) return;
  const url = URL.createObjectURL(r.file);
  const a = document.createElement('a');
  a.href = url;
  a.download = r.file.name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
};

// ===== 逐个下载所有文件 =====
btnDownloadAll.onclick = async () => {
  const ok = window._fileResults.filter(r => r.status === 'ok' && r.file);
  if (!ok.length) { alert('没有可下载的文件'); return; }
  
  if (ok.length === 1) {
    const url = URL.createObjectURL(ok[0].file);
    const a = document.createElement('a');
    a.href = url;
    a.download = ok[0].file.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return;
  }
  
  let downloaded = 0;
  for (const r of ok) {
    await new Promise((resolve) => {
      const url = URL.createObjectURL(r.file);
      const a = document.createElement('a');
      a.href = url;
      a.download = r.file.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => { URL.revokeObjectURL(url); resolve(); }, 800);
    });
    downloaded++;
  }
  alert(`✅ 已下载 ${downloaded} 个文件`);
};

// ===== 下载 ZIP =====
btnDownloadZip.onclick = () => {
  if (!window._resultBlob) { alert('没有可下载的文件'); return; }
  const url = URL.createObjectURL(window._resultBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = window._resultName || 'processed.zip';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 5000);
};

// ===== 预加载 JSZip =====
loadJSZip().then(lib => { JSZipLib = lib; }).catch(() => {});

setMode('encrypt');
setInputType('file');
</script>
